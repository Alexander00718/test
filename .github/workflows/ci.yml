name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, package
    runs-on: windows-latest   # the app is Windows-only by nature

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PowerShell modules
        id: psmodules
        uses: actions/cache@v4
        with:
          path: ~\Documents\WindowsPowerShell\Modules
          key: psmodules-${{ runner.os }}-pester5.5.0-pssa1.22.0

      - name: Install PowerShell modules
        if: steps.psmodules.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Force -Scope CurrentUser

      # -Strict makes warnings fail the build on CI, not just errors.
      - name: Lint
        shell: powershell
        run: .\build\Build.ps1 -Task Lint -Strict

      - name: Test
        shell: powershell
        run: .\build\Build.ps1 -Task Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/testResults.xml
            artifacts/coverage.xml
          if-no-files-found: warn

      - name: Summarise tests
        if: always()
        shell: powershell
        run: |
          $xml = 'artifacts/testResults.xml'
          if (Test-Path $xml) {
            [xml]$r = Get-Content $xml
            $s = $r.'test-results'
            "| metric | value |`n| --- | --- |`n| total | $($s.total) |`n| failures | $($s.failures) |`n| errors | $($s.errors) |`n" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Package
        shell: powershell
        run: .\build\Build.ps1 -Task Package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
