name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing in CI writes to the repository. The release
# workflow requests contents:write separately, and only when publishing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: windows-latest   # the app is Windows-only by nature
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ps-deps

      # -Strict promotes PSScriptAnalyzer warnings to build failures.
      - name: PSScriptAnalyzer (strict)
        shell: powershell
        run: .\build\Build.ps1 -Task Lint -Strict

  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ps-deps

      # Includes the AST parse suite, which is this project's stand-in for a
      # type checker: PowerShell has no static type analysis.
      - name: Pester
        shell: powershell
        run: .\build\Build.ps1 -Task Test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/testResults.xml
            artifacts/coverage.xml
          if-no-files-found: warn

      - name: Test summary
        if: always()
        shell: powershell
        run: |
          $xml = 'artifacts/testResults.xml'
          if (-not (Test-Path $xml)) { Write-Host 'no test results to summarise'; exit 0 }
          [xml]$r = Get-Content $xml
          $s = $r.'test-results'
          $lines = @(
            '## Test results',
            '',
            '| metric | value |',
            '| --- | --- |',
            ('| total | ' + $s.total + ' |'),
            ('| failures | ' + $s.failures + ' |'),
            ('| errors | ' + $s.errors + ' |')
          )
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  build:
    name: Build
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ps-deps

      - name: Package
        shell: powershell
        run: .\build\Build.ps1 -Task Package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
