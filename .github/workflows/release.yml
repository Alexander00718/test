name: Release

# Tag a commit to ship it:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.0.0'
        required: true

# contents:write is the only elevated permission in this repository, and it
# exists solely so the release job can create a GitHub Release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a publish midway

jobs:
  release:
    name: Verify and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same dependency path as CI and as a developer's machine.
      - uses: ./.github/actions/setup-ps-deps

      # A release never ships unverified: the same gates as CI, strict.
      - name: Lint
        shell: powershell
        run: .\build\Build.ps1 -Task Lint -Strict

      - name: Test
        shell: powershell
        run: .\build\Build.ps1 -Task Test

      - name: Package
        shell: powershell
        run: |
          $v = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($v)) { .\build\Build.ps1 -Task Package }
          else { .\build\Build.ps1 -Task Package -Version $v }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
